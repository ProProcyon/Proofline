<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proofline | Math, explained</title>
    <meta name="description" content="A calm math tutor that shows every step." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="." aria-label="Proofline home">
          <span class="brand-mark">∑</span>
          <span>proofline</span>
        </a>
        <div class="topbar-tools">
          <div class="coin-wallet" aria-live="polite"><span class="coin-icon">●</span><span id="coin-balance">0</span> coins</div>
          <div class="status"><span class="status-dot"></span>ready to reason</div>
        </div>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="eyebrow"><span></span>your patient math companion</div>
        <h1 id="page-title">Answers you can<br /><em>follow.</em></h1>
        <p class="hero-copy">Ask a math question in your own words. We’ll solve it carefully, then show the thinking behind every move.</p>
      </section>

      <section class="workspace" aria-label="Math problem workspace">
        <div class="prompt-panel">
          <form id="question-form">
            <label for="question">Your question</label>
            <textarea id="question" rows="3" placeholder="Try: Solve 3x + 7 = 22" spellcheck="false"></textarea>
            <div class="prompt-footer">
            <div class="suggestions" aria-label="Example questions">
              <button type="button" class="suggestion" data-question="What is 18% of 250?">18% of 250</button>
              <button type="button" class="suggestion" data-question="Solve 3x + 7 = 22">3x + 7 = 22</button>
              <button type="button" class="suggestion" data-question="What is 12 × 8 - 15?">12 × 8 − 15</button>
              <button type="button" class="suggestion" data-question="What is 3/4 + 1/8?">3/4 + 1/8</button>
              <button type="button" class="suggestion" data-question="Solve x + 7 = 7 + 7">x + 7 = 7 + 7</button>
              <button type="button" class="suggestion" data-question="Find the area of a triangle with base 8 and height 5">triangle area</button>
              <button type="button" class="suggestion" data-question="Mia has 7 stickers and gets 5 more. How many stickers does she have altogether?">word problem</button>
              <button type="button" class="suggestion" data-question="What is the perimeter of a rectangle with length 8 and width 3?">rectangle perimeter</button>
            </div>
              <button class="solve-button" id="solve" type="submit"><span>Explain it</span><span class="button-arrow">↗</span></button>
            </div>
            <p class="input-hint"><kbd>Enter</kbd> to solve <span>•</span> <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</p>
          </form>
          <div class="customize-row">
            <div><strong>Customize background</strong><span>Spend 10 coins per change</span></div>
            <div class="color-menu" aria-label="Background color menu">
              <button class="color-menu-toggle" type="button" aria-label="Open background menu">Palette</button>
              <div class="color-options" aria-label="Choose a background color">
                <button class="color-choice color-choice-paper" type="button" data-color="#f7f8f4" aria-label="Paper background"></button>
                <button class="color-choice color-choice-mint" type="button" data-color="#e4f3ea" aria-label="Mint background"></button>
                <button class="color-choice color-choice-sky" type="button" data-color="#e5f0f6" aria-label="Sky background"></button>
                <button class="color-choice color-choice-peach" type="button" data-color="#fff0e8" aria-label="Peach background"></button>
                <button class="color-choice color-choice-lavender" type="button" data-color="#eeeaf6" aria-label="Lavender background"></button>
                <button class="color-choice color-choice-flame" type="button" data-color="#ffe0d1" aria-label="Flame background"></button>
                <button class="color-choice color-choice-glow" type="button" data-color="#d7f5df" aria-label="Green glow background"></button>
                <button class="color-choice color-choice-lemon" type="button" data-color="#fff7c7" aria-label="Lemon background"></button>
                <button class="color-choice color-choice-ocean" type="button" data-color="#d7edf2" aria-label="Ocean background"></button>
                <button class="color-choice color-choice-rose" type="button" data-color="#f7dfe7" aria-label="Rose background"></button>
                <button class="color-choice color-choice-aqua" type="button" data-color="#d9fbff" aria-label="Aqua background"></button>
                <button class="color-choice color-choice-purple-void" type="button" data-color="#efe7ff" aria-label="Purple Void background"></button>
              </div>
            </div>
          </div>
          <button class="quiz-launch" id="quiz-launch" type="button"><span>Ready for a 3-question test?</span><span>Start test ↗</span></button>
